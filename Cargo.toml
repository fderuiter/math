[workspace]
members = [
    "crates/federated_registry",
    "crates/diagnostics",
    "crates/oxidize_core",
    "crates/verified_engine",
    "crates/verified_engine_macros",
    "crates/math_commons",
    "crates/pure_math",
    "crates/domain_ai",
    "crates/domain_physics",
    "crates/domain_biology",
    "crates/domain_applied",
    "crates/domain_climate",
    "crates/domain_epidemiology",
    "math_explorer",
    "math_explorer_gui",
    "crates/markdown_tests",
    "apps/xtask",
    "crates/unified_verification",
    "egui_plot"
]
resolver = "2"

[workspace.lints.rust]
missing_docs = "warn"

[workspace.lints.clippy]
too_many_lines = "deny"
cognitive_complexity = "deny"


[patch.crates-io]
egui_plot = { path = "egui_plot" }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
overflow-checks = true
panic = "abort"
