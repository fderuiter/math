[package]
name = "math_explorer_gui"
version = "0.1.0"
edition = "2021"

[features]
default = ["domain_logic", "ai", "applied", "biology", "climate", "epidemiology", "physics", "pure_math"]
domain_logic = ["dep:math_core", "dep:pure_math", "dep:applied", "dep:ai", "dep:biology", "dep:climate", "dep:epidemiology", "dep:physics"]
pure_math = ["dep:pure_math"]
applied = ["dep:applied", "pure_math"]
ai = ["dep:ai", "pure_math"]
biology = ["dep:biology", "applied", "pure_math"]
climate = ["dep:climate", "ai"]
epidemiology = ["dep:epidemiology", "pure_math"]
physics = ["dep:physics", "applied", "pure_math"]

[dependencies]
eframe = "0.33.3"
egui_plot = "0.34.1"

nalgebra = "0.34.0"
math_core = { path = "../crates/math_core", optional = true }
pure_math = { path = "../crates/pure_math", optional = true }
applied = { path = "../crates/applied", optional = true }
ai = { path = "../crates/ai", optional = true }
biology = { path = "../crates/biology", optional = true }
climate = { path = "../crates/climate", optional = true }
epidemiology = { path = "../crates/epidemiology", optional = true }
physics = { path = "../crates/physics", optional = true }
num-complex = "0.4.6"
rand = "0.8.5"
petgraph = "0.6.5"
oxidize_core = { version = "0.1.0", path = "../crates/oxidize_core" }

[target.'cfg(target_arch = "wasm32")'.dependencies]
console_error_panic_hook = "0.1.7"
getrandom = { version = "0.2.17", features = ["js"] }
wasm-bindgen = "0.2.100"
js-sys = "0.3.60"
web-sys = { version = "0.3.60", features = ["Window", "Document", "HtmlCanvasElement", "Element", "Node"] }

[target.wasm32-unknown-unknown.dependencies]
wasm-bindgen-futures = "0.4.72"
