name: Rust CI

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

env:
  CARGO_TERM_COLOR: always
  toolchain: stable

jobs:
  build-and-test:
    name: Build and Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          components: clippy, rustfmt

      - name: Cache dependencies
        uses: actions/cache@v3
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Check Formatting
        run: cargo fmt -- --check

      - name: Build
        run: cargo build --workspace --verbose

      - name: Run Tests
        run: cargo test --workspace --verbose

      - name: Run Clippy
        run: cargo clippy --workspace -- -D warnings -A deprecated -A clippy::unnecessary_literal_unwrap -A clippy::needless_range_loop -A clippy::module_inception -A clippy::assertions_on_constants -A unused_must_use -A dead_code -A unused_imports -A clippy::approx_constant -A unused_parens -A unused_variables -A clippy::items_after_test_module -A clippy::manual_range_contains -A clippy::len_zero -A clippy::useless_vec
