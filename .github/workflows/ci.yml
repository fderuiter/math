name: Rust CI

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

env:
  CARGO_TERM_COLOR: always

jobs:
  build-and-test:
    name: Build and Test (${{ matrix.target }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            name: Linux Native
          - target: wasm32-unknown-unknown
            name: Web/WASM

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python for Traceability
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'

      - name: Install PyTorch (Linux)
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        run: pip install torch==2.2.0

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          components: clippy, rustfmt
          targets: ${{ matrix.target }}

      - name: Cache dependencies
        uses: actions/cache@v3
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}-${{ matrix.target }}
          restore-keys: |
            ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}-
            ${{ runner.os }}-cargo-

      - name: Check Traceability
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        run: python3 scripts/traceability.py

      - name: Check Formatting
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        run: cargo fmt --all -- --check

      - name: Check File Lengths (500 lines limit)
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        run: |
          echo "Checking for files exceeding 500 lines in core math directories..."
          # Define the directories to check
          DIRS_TO_CHECK="math_explorer/src/physics math_explorer/src/biology math_explorer/src/pure_math"
          
          # Find files exceeding 500 lines
          EXCEEDING_FILES=$(find $DIRS_TO_CHECK -name "*.rs" -type f -exec wc -l {} + | awk '$1 > 500 && $2 != "total" {print $0}')
          
          if [ -n "$EXCEEDING_FILES" ]; then
            echo "Error: The following files exceed the 500-line limit:"
            echo "$EXCEEDING_FILES"
            echo "Please split these files using the Strategy pattern."
            exit 1
          else
            echo "All checked files are within the 500-line limit."
          fi

      - name: Build (Native)
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        run: cargo build --workspace --verbose --all-features
        env:
          LIBTORCH_USE_PYTORCH: 1
          LIBTORCH_BYPASS_VERSION_CHECK: 1

      - name: Run Tests (Native)
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        run: |
          export LD_LIBRARY_PATH=$(python3 -c "import torch; print(torch.__path__[0] + '/lib')"):$LD_LIBRARY_PATH
          cargo test --workspace --verbose --all-features
        env:
          LIBTORCH_USE_PYTORCH: 1
          LIBTORCH_BYPASS_VERSION_CHECK: 1

      - name: Run Clippy (Native)
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        run: cargo clippy --workspace --all-features -- -D warnings -D clippy::too_many_lines -D clippy::cognitive_complexity
        env:
          LIBTORCH_USE_PYTORCH: 1
          LIBTORCH_BYPASS_VERSION_CHECK: 1

      - name: Check Workspace (WASM)
        if: matrix.target == 'wasm32-unknown-unknown'
        run: cargo check --workspace --target wasm32-unknown-unknown --all-features --verbose

      - name: Check Workspace Tests (WASM)
        if: matrix.target == 'wasm32-unknown-unknown'
        run: cargo check --tests --workspace --target wasm32-unknown-unknown --all-features --verbose

      - name: Build GUI for WASM
        if: matrix.target == 'wasm32-unknown-unknown'
        run: cargo build -p math_explorer_gui --target wasm32-unknown-unknown --verbose

  feature-matrix:
    name: Domain Tests (${{ matrix.feature || 'core-only' }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        feature:
          - pure_math
          - applied
          - ai
          - biology
          - climate
          - epidemiology
          - physics
          - '' # This tests --no-default-features

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'

      - name: Install PyTorch (AI only)
        if: matrix.feature == 'ai'
        run: pip install torch==2.2.0

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable

      - name: Cache dependencies
        uses: actions/cache@v3
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-features-${{ matrix.feature }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-features-${{ matrix.feature }}-

      - name: Run Tests
        run: |
          if [ "${{ matrix.feature }}" = "ai" ]; then
            export LD_LIBRARY_PATH=$(python3 -c "import torch; print(torch.__path__[0] + '/lib')"):$LD_LIBRARY_PATH
            export LIBTORCH_USE_PYTORCH=1
            export LIBTORCH_BYPASS_VERSION_CHECK=1
          fi
          
          if [ -n "${{ matrix.feature }}" ]; then
            cargo test -p math_explorer --no-default-features --features ${{ matrix.feature }}
          else
            cargo test -p math_explorer --no-default-features
          fi
