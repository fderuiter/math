name: Rust CI

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

env:
  CARGO_TERM_COLOR: always

jobs:
  build-and-test:
    name: Build and Test (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            name: Linux Native
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            name: Windows Native
          - os: macos-latest
            target: x86_64-apple-darwin
            name: macOS Native
          - os: ubuntu-latest
            target: wasm32-unknown-unknown
            name: Web/WASM

    steps:
      - name: Free Disk Space
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf /opt/hostedtoolcache/CodeQL

      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          components: clippy, rustfmt
          targets: ${{ matrix.target }}

      - name: Cache dependencies
        uses: actions/cache@v3
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}-${{ matrix.target }}
          restore-keys: |
            ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}-
            ${{ runner.os }}-cargo-

      - name: Verify Architectural Records Updates
        if: matrix.target != 'wasm32-unknown-unknown'
        run: cargo run -p xtask -- verify-records
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}

      - name: Check Traceability
        if: matrix.target != 'wasm32-unknown-unknown'
        run: cargo run -p xtask -- traceability

      - name: Check Formatting
        if: matrix.target != 'wasm32-unknown-unknown'
        run: cargo fmt --all -- --check

      - name: Build (Native)
        if: matrix.target != 'wasm32-unknown-unknown'
        run: cargo build --workspace --verbose --all-features

      - name: Run Tests (Native)
        if: matrix.target != 'wasm32-unknown-unknown'
        run: cargo test --workspace --verbose --all-features

      - name: Run Clippy (Native)
        if: matrix.target != 'wasm32-unknown-unknown'
        run: cargo clippy --workspace --all-features -- -D warnings -D clippy::too_many_lines -D clippy::cognitive_complexity

      - name: Run Integrity Verified Suite
        if: matrix.target != 'wasm32-unknown-unknown'
        run: cargo run -p xtask -- verify-suite

      - name: Check Workspace (WASM)
        if: matrix.target == 'wasm32-unknown-unknown'
        run: cargo check --workspace --target wasm32-unknown-unknown --all-features --verbose

      - name: Check Workspace Tests (WASM)
        if: matrix.target == 'wasm32-unknown-unknown'
        run: cargo check --tests --workspace --target wasm32-unknown-unknown --all-features --verbose

      - name: Build GUI for WASM
        if: matrix.target == 'wasm32-unknown-unknown'
        run: cargo build -p math_explorer_gui --target wasm32-unknown-unknown --verbose

  feature-matrix:
    name: Domain Tests (${{ matrix.feature || 'core-only' }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        feature:
          - pure_math
          - applied
          - ai
          - biology
          - climate
          - epidemiology
          - physics
          - '' # This tests --no-default-features

    steps:
      - name: Free Disk Space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf /opt/hostedtoolcache/CodeQL

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable

      - name: Cache dependencies
        uses: actions/cache@v3
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-features-${{ matrix.feature }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-features-${{ matrix.feature }}-

      - name: Run Tests
        run: |
          if [ -n "${{ matrix.feature }}" ]; then
            cargo run -p xtask -- test-features ${{ matrix.feature }}
          else
            cargo run -p xtask -- test-features core-only
          fi

  package:
    name: Package Installers (${{ matrix.os }})
    needs: build-and-test
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: deb
          - os: macos-latest
            target: dmg
          - os: windows-latest
            target: wix

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies (Ubuntu)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libxdo-dev build-essential

      - name: Install PyTorch (Ubuntu/macOS)
        if: matrix.os != 'windows-latest'
        run: pip install setuptools "numpy<2" torch==2.2.0 --break-system-packages || pip install setuptools "numpy<2" torch==2.2.0

      - name: Install PyTorch (Windows)
        if: matrix.os == 'windows-latest'
        run: pip install setuptools "numpy<2" torch==2.2.0

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable

      - name: Install cargo-packager
        run: cargo install cargo-packager

      - name: Build and Package
        shell: bash
        run: |
          export LIBTORCH_USE_PYTORCH=1
          export LIBTORCH_BYPASS_VERSION_CHECK=1
          if [ "${{ matrix.os }}" != "windows-latest" ]; then
            export LD_LIBRARY_PATH=$(python -c "import torch; print(torch.__path__[0] + '/lib')"):$LD_LIBRARY_PATH
            export DYLD_LIBRARY_PATH=$(python -c "import torch; print(torch.__path__[0] + '/lib')"):$DYLD_LIBRARY_PATH
          else
            export LIB=($(python -c "import torch; print(torch.__path__[0] + '/lib')"))
          fi
          cargo packager --release -p math_explorer_gui -f ${{ matrix.target }}

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: math_explorer-${{ matrix.target }}
          path: dist/*
