name: Compile Papers

on:
  push:
    branches: [ "main" ]
    paths:
      - 'papers/**'
  pull_request:
    paths:
      - 'papers/**'

jobs:
  build-papers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install TeX Live
        run: |
          sudo apt-get update
          sudo apt-get install -y texlive-latex-base texlive-fonts-recommended texlive-fonts-extra texlive-latex-extra texlive-science

      - name: Compile LaTeX Documents
        working-directory: ./papers
        run: |
          # Loop through all .tex files and attempt to compile them
          for file in *.tex; do
            echo "Compiling $file..."
            # Run twice to resolve references/citations
            pdflatex -interaction=nonstopmode "$file" || exit 1
            pdflatex -interaction=nonstopmode "$file" || exit 1
          done
