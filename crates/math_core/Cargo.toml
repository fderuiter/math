[package]
name = "math_core"
version = "0.4.0"
edition = "2024"

[dependencies]
nalgebra = "0.34.0"
serde = { version = "1.0.228", features = ["derive"] }
thiserror = "2.0.18"
verified_engine = { version = "0.1.0", path = "../verified_engine" }
approx = "0.5.1"
quadrature = "0.1.2"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
rug = "1.28.0"

[target.'cfg(target_arch = "wasm32")'.dependencies]
rug_mock = { path = "../rug_mock" }
