[package]
name = "unified_verification"
version = "0.1.0"
edition = "2024"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
regex = "1.10"
walkdir = "2.4"
syn = { version = "2.0.118", features = ["full", "visit"] }
toml = "1.1.2"
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
ureq = { version = "2.9.6", features = ["json"] }

[profile.release]
overflow-checks = true
