[package]
name = "oxidize_core"
version = "0.1.0"
edition = "2024"

[dependencies]
obj-exporter = "0.2.0"
proc-macro2 = "1.0.106"
quote = "1.0.46"
serde = { version = "1.0.228", features = ["derive"] }
syn = { version = "2.0.118", features = ["full", "visit"] }
thiserror = "2.0.18"
toml = "1.1.2"

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2.100"
js-sys = "0.3.60"
web-sys = { version = "0.3.60", features = ["Window", "Document", "HtmlElement", "Blob", "Url", "BlobPropertyBag"] }

[dev-dependencies]
approx = "0.5.1"
