[package]
name = "oxidize_core"
version = "0.1.0"
edition = "2024"

[dependencies]
obj-exporter = "0.2.0"
serde = { version = "1.0.228", features = ["derive"] }
thiserror = "2.0.18"
toml = "1.1.2"

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2.100"
js-sys = "0.3.60"
web-sys = { version = "0.3.60", features = ["Window", "Document", "HtmlElement", "Blob", "Url", "BlobPropertyBag"] }

[dev-dependencies]
approx = "0.5.1"
[build-dependencies]
regex = "1"
