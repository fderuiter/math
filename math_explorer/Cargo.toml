[package]
name = "math_explorer"
version = "0.4.0"
edition = "2024"
license = "AGPL-3.0-or-later"

[dependencies]
rustfft = "6.2.0"
nalgebra = "0.34.0"
quadrature = "0.1.2"
rand = "0.8.6"
statrs = "0.17.0"
petgraph = "0.6.4"
rand_distr = "0.4.3"
num-complex = "0.4.6"
thiserror = "2.0.18"
num-traits = "0.2.19"
oxidize_core = { path = "../crates/oxidize_core" }
verified_engine = { version = "0.1.0", path = "../crates/verified_engine" }
serde_json = "1.0.150"
serde = { version = "1.0.228", features = ["derive"] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
rug = "1.28.0"
wigner-symbols = "0.5.0"

[target.'cfg(target_arch = "wasm32")'.dependencies]
rug_mock = { path = "../crates/rug_mock" }
wigner_mock = { path = "../crates/wigner_mock" }
getrandom = { version = "0.2.17", features = ["js"] }

[[test]]
name = "elliptic_curves"
path = "tests/elliptic_curves.rs"

[[test]]
name = "algorithmic_information"
path = "tests/algorithmic_information.rs"

[dev-dependencies]
approx = "0.5.1"
rand = "0.8.6"

[dev-dependencies.criterion]
version = "0.5.1"
default-features = false
features = ["html_reports"]

[[bench]]
name = "sorting_benchmark"
harness = false

[features]
default = []
pure_math = []
applied = ["pure_math"]
ai = ["pure_math"]
biology = ["applied", "pure_math"]
climate = ["ai"]
epidemiology = ["pure_math"]
physics = ["applied", "pure_math"]

[[example]]
name = "bench_morphogenesis"
required-features = ["biology"]

[[example]]
name = "bench_music"
required-features = ["physics"]

